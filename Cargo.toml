[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "shopping-sessions"
path = "src/main.rs"

[dependencies]
arrow-array = "=56.2.0"
arrow-schema = "=56.2.0"
parquet = { version = "=56.2.0", default-features = false, features = ["arrow"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
